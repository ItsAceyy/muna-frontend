# GitHub opens a pull request when a dependency has a security fix or a new
# version. CI and a Vercel preview run on each one, so a passing PR is usually
# safe to merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
