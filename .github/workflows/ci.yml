name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Errors fail the build; warnings are reported but do not.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # The build needs no secrets - the API URL falls back to the deployed
      # backend - so this is exactly what Vercel will run.
      - name: Build
        run: npm run build
