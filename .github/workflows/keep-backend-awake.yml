name: Keep backend awake

# Render's free tier puts the backend to sleep after 15 minutes without traffic,
# and the first request after that takes about 50 seconds - a guard at the gate
# would be left waiting. Calling /health every 10 minutes keeps it awake.
#
# It doubles as a basic uptime alert: if the backend does not answer, this run
# fails and GitHub emails the repository owner.
#
# Lives in this repository because it is public, where Actions minutes are free.
# GitHub can delay scheduled runs at busy times and pauses them after 60 days with
# no repository activity; the Actions tab says so and one click re-enables it.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /health
        run: |
          # Generous timeout and retries: a cold start alone can take a minute.
          curl --fail --silent --show-error --max-time 90 \
               --retry 3 --retry-delay 20 --retry-all-errors \
               https://muna-vms-staging.onrender.com/health
